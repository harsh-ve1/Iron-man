<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark 85 - Verma Group Nanotech HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        body, html { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #030303; color: #00ffff; font-family: 'Courier New', Courier, monospace; user-select: none; }
        
        /* High-Contrast Professional Overlays */
        .vignette { position: absolute; inset: 0; box-shadow: inset 0 0 200px rgba(0,0,0,0.95); z-index: 10; pointer-events: none; }
        .grid-bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px); background-size: 50px 50px; z-index: 11; pointer-events: none; opacity: 0.3; }
        
        .input_video { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
        .output_canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); filter: contrast(1.3) grayscale(0.2); z-index: 1; }
        .overlay_canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 5; pointer-events: none; }

        /* Minimalist UI */
        .hud-ui { position: absolute; inset: 0; z-index: 20; pointer-events: none; opacity: 0; transition: opacity 1s ease-in; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; }
        .hud-visible { opacity: 1; }
        
        .sys-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 50; }
        .flash-overlay { position: absolute; inset: 0; background: #fff; z-index: 99; opacity: 0; pointer-events: none; }
        .flash-active { animation: flash-bang 1.5s ease-out forwards; }

        @keyframes flash-bang { 0% { opacity: 1; } 10% { background: #00ffff; opacity: 0.8; } 100% { opacity: 0; background: transparent; } }
    </style>
</head>
<body>

    <video class="input_video" autoplay playsinline></video>
    <canvas class="output_canvas"></canvas>
    <canvas class="overlay_canvas"></canvas>

    <div class="vignette"></div>
    <div class="grid-bg"></div>
    <div id="flash" class="flash-overlay"></div>

    <div id="status-container" class="sys-msg">
        <div class="text-3xl font-bold tracking-[0.5em] text-white drop-shadow-[0_0_10px_#00ffff]">CALIBRATING AI</div>
        <div class="text-xs mt-4 text-cyan-500 tracking-widest">AWAITING SUBJECT IN FRAME</div>
    </div>

    <div id="main-hud" class="hud-ui">
        <div class="flex justify-between items-start">
            <div class="border-l-2 border-cyan-500 pl-4 bg-black/60 backdrop-blur-md py-2">
                <div class="text-[10px] text-cyan-600 tracking-widest">VERMA GROUP // NANOTECH DIV</div>
                <div class="text-xl font-bold text-white tracking-widest mt-1">SYS_POWER: <span id="power-val">100</span>%</div>
            </div>
            
            <div class="text-right border-r-2 border-cyan-500 pr-4 bg-black/60 backdrop-blur-md py-2">
                <div class="text-[10px] text-cyan-600 tracking-widest">TARGETING & DEFENSE</div>
                <div class="text-lg font-bold text-green-400 tracking-widest mt-1">ONLINE</div>
            </div>
        </div>

        <div class="flex justify-between items-end">
            <div class="text-xs text-cyan-500 bg-black/80 p-3 border border-cyan-900 leading-relaxed tracking-wider">
                [GESTURES]<br>
                > RAISE HANDS: Repulsors<br>
                > CROSS WRISTS: Energy Shield<br>
                > TOUCH SHOULDER: Micro-Missile
            </div>
            <div class="text-right">
                <div class="text-[10px] text-cyan-600 tracking-widest mb-1">MISSILE PAYLOAD</div>
                <div id="missile-count" class="text-3xl text-white font-bold drop-shadow-[0_0_8px_#00ffff]">24</div>
            </div>
        </div>
    </div>

    <script>
        const video = document.querySelector('.input_video');
        const canvas = document.querySelector('.output_canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const overlayCanvas = document.querySelector('.overlay_canvas');
        const overlayCtx = overlayCanvas.getContext('2d');
        
        let isSuitedUp = false;
        let isDetecting = false;
        let missiles = 24;
        let activeMissiles = []; // To track flying missiles
        
        // Zero-Lag Audio Engine
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'suit') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(40, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 1.2);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.4, now + 0.2);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
                osc.start(now); osc.stop(now + 1.5);
            } else if (type === 'repulsor' || type === 'booster') {
                osc.type = 'square'; osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.15, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'shield') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, now);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.2, now + 0.1);
                gain.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'missile') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        }

        function resize() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            overlayCanvas.width = window.innerWidth; overlayCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize); resize();

        function triggerSuitUp() {
            isSuitedUp = true;
            document.getElementById('status-container').style.opacity = '0';
            document.getElementById('flash').classList.add('flash-active');
            playSound('suit');
            setTimeout(() => document.getElementById('main-hud').classList.add('hud-visible'), 800);
        }

        // --- DRAWING FUNCTIONS (Optimized for Canvas) ---
        
        function drawArcReactor(x, y, size) {
            overlayCtx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                overlayCtx[i===0?'moveTo':'lineTo'](x + size * Math.cos(angle), y + size * Math.sin(angle));
            }
            overlayCtx.closePath();
            overlayCtx.lineWidth = 3; overlayCtx.strokeStyle = '#00ffff'; overlayCtx.stroke();
            overlayCtx.fillStyle = 'rgba(0, 255, 255, 0.1)'; overlayCtx.fill();
            
            overlayCtx.beginPath(); overlayCtx.arc(x, y, size * 0.4, 0, Math.PI * 2);
            overlayCtx.fillStyle = '#fff'; overlayCtx.fill();
            overlayCtx.shadowBlur = 20; overlayCtx.shadowColor = '#00ffff'; overlayCtx.stroke(); overlayCtx.shadowBlur = 0;
        }

        function drawRepulsor(x, y, size, isFiring) {
            overlayCtx.beginPath(); overlayCtx.arc(x, y, size, 0, Math.PI * 2);
            overlayCtx.strokeStyle = '#00ffff'; overlayCtx.lineWidth = 2; overlayCtx.stroke();
            overlayCtx.beginPath(); overlayCtx.arc(x, y, isFiring ? size*0.8 : size*0.3, 0, Math.PI * 2);
            overlayCtx.fillStyle = isFiring ? '#fff' : 'rgba(0, 255, 255, 0.4)'; 
            if(isFiring) { overlayCtx.shadowBlur = 30; overlayCtx.shadowColor = '#00ffff'; }
            overlayCtx.fill(); overlayCtx.shadowBlur = 0;
        }

        function drawBooster(x, y, size) {
            // Dynamic Flame
            const flicker = Math.random() * 20;
            const gradient = overlayCtx.createLinearGradient(x, y, x, y + size * 3 + flicker);
            gradient.addColorStop(0, '#fff'); gradient.addColorStop(0.2, '#00ffff'); gradient.addColorStop(1, 'transparent');
            
            overlayCtx.beginPath();
            overlayCtx.moveTo(x - size, y); overlayCtx.lineTo(x + size, y);
            overlayCtx.lineTo(x, y + size * 3 + flicker);
            overlayCtx.fillStyle = gradient; overlayCtx.fill();
        }

        function drawShield(x, y, size) {
            const gradient = overlayCtx.createRadialGradient(x, y, size*0.2, x, y, size);
            gradient.addColorStop(0, 'rgba(0, 255, 255, 0.1)');
            gradient.addColorStop(0.8, 'rgba(0, 255, 255, 0.4)');
            gradient.addColorStop(1, 'transparent');
            
            overlayCtx.beginPath(); overlayCtx.arc(x, y, size, 0, Math.PI * 2);
            overlayCtx.fillStyle = gradient; overlayCtx.fill();
            
            // Hexagon grid effect inside shield
            overlayCtx.strokeStyle = 'rgba(0, 255, 255, 0.2)'; overlayCtx.lineWidth = 1;
            for(let i=0; i<3; i++) {
                overlayCtx.beginPath(); overlayCtx.arc(x, y, size * (0.3 * (i+1)), 0, Math.PI * 2); overlayCtx.stroke();
            }
        }

        // --- MEDIAPIPE AI LOOP ---

        function onResults(results) {
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(0, 5, 10, 0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Dark Corporate Tint
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

            if (results.poseLandmarks) {
                const lm = results.poseLandmarks;
                const w = overlayCanvas.width, h = overlayCanvas.height;

                if (!isSuitedUp && !isDetecting) {
                    isDetecting = true;
                    document.querySelector('.sys-msg > div:last-child').innerText = "BODY ACQUIRED. INITIALIZING...";
                    setTimeout(triggerSuitUp, 1500);
                }

                if (isSuitedUp) {
                    const lShoulder = lm[11], rShoulder = lm[12];
                    const lWrist = lm[15], rWrist = lm[16];
                    const lElbow = lm[13], rElbow = lm[14];
                    const lAnkle = lm[27], rAnkle = lm[28];
                    
                    const chestX = ((lShoulder.x + rShoulder.x) / 2) * w;
                    const chestY = ((lShoulder.y + rShoulder.y) / 2) * h + 40;
                    const scale = Math.max(0.5, Math.abs(lShoulder.x - rShoulder.x) * 2);

                    // 1. Arc Reactor
                    drawArcReactor(chestX, chestY, 30 * scale);

                    // 2. Shield Logic (Cross Wrists near chest)
                    const wristDist = Math.abs(lWrist.x - rWrist.x);
                    if (wristDist < 0.1 && lWrist.y > lShoulder.y && lWrist.y < lAnkle.y) {
                        drawShield(chestX, chestY, 200 * scale);
                        if(Math.random() > 0.9) playSound('shield');
                    }

                    // 3. Repulsor Logic (Wrists above elbows)
                    const lFire = lWrist.y < lElbow.y - 0.05;
                    const rFire = rWrist.y < rElbow.y - 0.05;
                    if (lWrist.visibility > 0.5) drawRepulsor(lWrist.x * w, lWrist.y * h, 20 * scale, lFire);
                    if (rWrist.visibility > 0.5) drawRepulsor(rWrist.x * w, rWrist.y * h, 20 * scale, rFire);
                    if ((lFire || rFire) && Math.random() > 0.8) playSound('repulsor');

                    // 4. Flight Boosters (At ankles)
                    if (lAnkle.visibility > 0.5) { drawBooster(lAnkle.x * w, lAnkle.y * h, 15 * scale); playSound('booster'); }
                    if (rAnkle.visibility > 0.5) { drawBooster(rAnkle.x * w, rAnkle.y * h, 15 * scale); }

                    // 5. Missile Logic (Touch left shoulder with right hand, or vice versa)
                    const rHandToLShoulder = Math.hypot(rWrist.x - lShoulder.x, rWrist.y - lShoulder.y) < 0.1;
                    const lHandToRShoulder = Math.hypot(lWrist.x - rShoulder.x, lWrist.y - rShoulder.y) < 0.1;
                    
                    if ((rHandToLShoulder || lHandToRShoulder) && missiles > 0 && Math.random() > 0.9) {
                        activeMissiles.push({ x: (rHandToLShoulder ? lShoulder.x : rShoulder.x) * w, y: (rHandToLShoulder ? lShoulder.y : rShoulder.y) * h });
                        missiles--; document.getElementById('missile-count').innerText = missiles;
                        playSound('missile');
                    }
                }
            } else if (isSuitedUp) {
                isSuitedUp = false; isDetecting = false;
                document.getElementById('status-container').style.opacity = '1';
                document.getElementById('main-hud').classList.remove('hud-visible');
            }

            // Update & Draw Flying Missiles
            for (let i = activeMissiles.length - 1; i >= 0; i--) {
                let m = activeMissiles[i];
                m.y -= 15; // Move up fast
                
                overlayCtx.beginPath();
                overlayCtx.arc(m.x, m.y, 4, 0, Math.PI*2);
                overlayCtx.fillStyle = '#fff'; overlayCtx.fill();
                
                // Missile trail
                overlayCtx.beginPath(); overlayCtx.moveTo(m.x, m.y); overlayCtx.lineTo(m.x, m.y + 30);
                overlayCtx.strokeStyle = '#ffcc00'; overlayCtx.lineWidth = 2; overlayCtx.stroke();

                if (m.y < 0) activeMissiles.splice(i, 1); // Remove off-screen
            }
        }

        const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        pose.onResults(onResults);

        const camera = new Camera(video, { onFrame: async () => { await pose.send({image: video}); }, width: 1280, height: 720 });
        camera.start();

    </script>
</body>
</html>
